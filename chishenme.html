<!DOCTYPE html>

        select { padding: 5px 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9rem; }

        .dish-item { background: #fefae0; margin: 5px 0; padding: 8px 10px; border-radius: 5px; border-left: 4px solid #dda15e; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
        .dish-info { display: flex; align-items: center; gap: 6px; flex: 1; }
        .dish-time { font-size: 0.75rem; color: #888; font-weight: normal; background: #fff3e0; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
        .total-time { margin-top: 10px; padding: 8px 12px; background: #e8f5e9; border-radius: 5px; font-size: 0.9rem; color: #2e7d32; text-align: center; }
        .lock-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 2px 6px; margin: 0; width: auto; color: #aaa; transition: 0.2s; }
        .lock-btn.locked { color: #e63946; }
        .timeline { font-size: 0.85rem; color: #666; background: #f1faee; padding: 10px; border-radius: 5px; margin-top: 15px; line-height: 1.6; }
        .timeline b { color: #1d3557; }
        .ai-section { margin-top: 15px; background: linear-gradient(135deg, #f1faee, #e8f4f8); padding: 15px; border-radius: 8px; border-left: 4px solid #457b9d; line-height: 1.8; font-size: 0.9rem; }
        .ai-section b { color: #1d3557; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .loading::after { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid #e63946; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #e63946; background: #ffe5e5; padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 0.85rem; }
        .btn-group { display: flex; gap: 8px; }
        .btn-ai { background: #457b9d; }
        .btn-ai:hover { background: #1d3557; }
        .source-tag { font-size: 0.7rem; color: #fff; padding: 1px 5px; border-radius: 8px; margin-left: 4px; font-weight: normal; }

    </style>
</head>

// 获取当前选中来源的合并菜单
function getActiveMenu() {
    const source = document.getElementById('menuSource').value;
    if (source === 'all') {
        // 合并所有来源，给每道菜打上来源标记
        const merged = { hard:[], fastMeat:[], veg:[], cold:[], soup:[] };
        for (const [src, menu] of Object.entries(MENU_DB)) {
            for (const cat of Object.keys(merged)) {
                merged[cat].push(...menu[cat].map(d => ({...d, source: src})));
            }
        }
        return merged;
    }
    const menu = MENU_DB[source];
    return {
        hard: menu.hard.map(d => ({...d, source})),
        fastMeat: menu.fastMeat.map(d => ({...d, source})),
        veg: menu.veg.map(d => ({...d, source})),
        cold: menu.cold.map(d => ({...d, source})),
        soup: menu.soup.map(d => ({...d, source}))
    };
}

function onSourceChange() {
    // 切换来源时清除锁定
    lockedDishes = {};
    lockedSoups = {};
    document.getElementById('result').style.display = 'none';
}

function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateMenu() {
    const dCount = parseInt(document.getElementById('dishCount').value);
    const sCount = parseInt(document.getElementById('soupCount').value);
    const MENU = getActiveMenu();

    let selectedDishes = [];
    let usedNames = new Set();

    // 第1道优先选硬菜
    if (dCount >= 1) {
        if (lockedDishes[0]) {
            selectedDishes.push(lockedDishes[0]);
            usedNames.add(lockedDishes[0].name);
        } else {
            let pool = MENU.hard.concat(MENU.fastMeat);
            let pick = pickRandom(pool);
            selectedDishes.push(pick);
            usedNames.add(pick.name);
        }
    }

    // 剩下的菜从快手肉、素菜、凉菜里随机
    if (dCount > 1) {
        let pool = MENU.fastMeat.concat(MENU.veg).concat(MENU.cold);
        let attempts = 0;
        for (let i = 0; i < dCount - 1; i++) {
            const idx = i + 1;
            if (lockedDishes[idx]) {
                selectedDishes.push(lockedDishes[idx]);
                usedNames.add(lockedDishes[idx].name);
            } else {
                let pick = pickRandom(pool);
                if (!usedNames.has(pick.name)) {
                    selectedDishes.push(pick);
                    usedNames.add(pick.name);
                    attempts = 0;
                } else {
                    attempts++;
                    if (attempts > 50) { selectedDishes.push(pick); usedNames.add(pick.name); attempts = 0; }
                    else { i--; }
                }
            }
        }
    }

    // 选汤
    let selectedSoups = [];
    for (let i = 0; i < sCount; i++) {
        if (lockedSoups[i]) {
            selectedSoups.push(lockedSoups[i]);
        } else {
            selectedSoups.push(pickRandom(MENU.soup));
        }
    }

    // 清理超出范围的锁定
    for (let k in lockedDishes) { if (k >= dCount) delete lockedDishes[k]; }
    for (let k in lockedSoups) { if (k >= sCount) delete lockedSoups[k]; }

    currentDishes = selectedDishes;
    currentSoups = selectedSoups;
    renderResult();
}

function renderResult() {
    const dishListDiv = document.getElementById('dishList');
    const showSource = document.getElementById('menuSource').value === 'all';
    dishListDiv.innerHTML = "<strong>今日菜单：</strong>";

    currentDishes.forEach((d, i) => {
        const isLocked = !!lockedDishes[i];
        const sourceTag = showSource ? `<span class="source-tag source-${d.source}">${d.source}</span>` : '';
        dishListDiv.innerHTML += `<div class="dish-item">
            <div class="dish-info">🍛 ${d.name}${sourceTag}<span class="dish-time">⏱${d.time}min</span></div>
            <button class="lock-btn ${isLocked ? 'locked' : ''}" onclick="toggleLock('dish',${i})">${isLocked ? '🔒' : '🔓'}</button>
        </div>`;
    });

    currentSoups.forEach((s, i) => {
        const isLocked = !!lockedSoups[i];
        const sourceTag = showSource ? `<span class="source-tag source-${s.source}">${s.source}</span>` : '';
        dishListDiv.innerHTML += `<div class="dish-item" style="border-left-color:#457b9d">
            <div class="dish-info">🥣 ${s.name}${sourceTag}<span class="dish-time">⏱${s.time}min</span></div>
            <button class="lock-btn ${isLocked ? 'locked' : ''}" onclick="toggleLock('soup',${i})">${isLocked ? '🔒' : '🔓'}</button>
        </div>`;
    });

    // 显示总时间估算
    const allItems = [...currentDishes, ...currentSoups];
    const maxTime = Math.max(...allItems.map(d => d.time));
    const sumTime = allItems.reduce((s, d) => s + d.time, 0);
    document.getElementById('totalTime').innerHTML =
        `<div class="total-time">⏱ 串行总时间 ~${sumTime}min / 并行最快 ~${maxTime}min</div>`;

    document.getElementById('result').style.display = 'block';
    document.getElementById('aiResult').innerHTML = '';
}

function toggleLock(type, index) {
    if (type === 'dish') {
        if (lockedDishes[index]) { delete lockedDishes[index]; }
        else { lockedDishes[index] = currentDishes[index]; }
    } else {
        if (lockedSoups[index]) { delete lockedSoups[index]; }
        else { lockedSoups[index] = currentSoups[index]; }
    }
    renderResult();
}

async function askAI() {
    const aiDiv = document.getElementById('aiResult');
    aiDiv.innerHTML = '<div class="loading">AI 正在规划出餐方案…</div>';

    try {
        const resp = await fetch('/api/cooking-plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                dishes: currentDishes.map(d => d.name),
                soups: currentSoups.map(d => d.name),
                people: parseInt(document.getElementById('peopleCount').value)
            })
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `请求失败 (${resp.status})`);
        }

        const data = await resp.json();
        aiDiv.innerHTML = `<div class="ai-section">${data.plan}</div>`;
    } catch (e) {
        aiDiv.innerHTML = `<div class="error">⚠️ ${e.message}</div>`;
    }
}
</script>
